---
All our reference pages use this template, and we want them to have clickable links for each header.
header_anchors: true
scripts: /static/nav.js
---

<!doctype html>
<html lang="en">
<head>{{include: head-stuff}}</head>
<body class="layout-nav" data-section="{{section}}">
  <input type="checkbox" id="burger-state" />
  {{include: site-header}}
  <nav class="site-nav">
    {{include: docs}}
  </nav>
  <main id="content">
    <h1>{{title}}</h1>
    {{content}}
    <div class="page-nav">
      {{prev-in-docs}}
      {{next-in-docs}}
    </div>
    <footer>{{include: footer}}</footer>
  </main>
</body>
</html>
