---
All our reference pages use this template, and we want them to have clickable links for each header.
header_anchors: true
styles: /static/docs.css
---

<!doctype html>
<html lang="en">
<head>{{include: head-stuff}}</head>
<body data-section="{{section}}">
  <input type="checkbox" id="burger-state" />
  {{include: site-header}}
  <aside>
    <nav>
      {{include: docs}}
    </nav>
  </aside>
  <main id="content">
    <h1>{{title}}</h1>
    {{content}}
    <div class="page-nav">
      {{prev-in-docs}}
      {{next-in-docs}}
    </div>
    <footer>{{include: footer}}</footer>
  </main>
</body>
</html>
