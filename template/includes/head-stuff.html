<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{head-title}}</title>

{{# Using a webfont? Preload it here so it doesn't arrive after first paint:
    <link rel="preload" href="/static/fonts/yourfont.woff2" as="font" type="font/woff2" crossorigin> }}

<link rel="stylesheet" href="/static/base.css">

<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">

<link href="/index.xml" rel="alternate" type="application/rss+xml" title="{{site-title}}">

<meta name="description" content="{{og-description}}">

{{og-image-tag}}
<meta property="og:title" content="{{head-title}}">
<meta property="og:description" content="{{og-description}}">
<meta property="og:type" content="{{og-type}}">
<meta property="og:url" content="{{og-url}}">

<script defer src="/static/theme.js"></script>
