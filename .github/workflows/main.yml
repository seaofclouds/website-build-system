name: Build and Deploy

# Builds the site and publishes it to Cloudflare Pages on every push to main.
#
# To use this you need two repository secrets, under Settings → Secrets and variables
# → Actions:
#
#   CLOUDFLARE_API_TOKEN    an API token with the "Cloudflare Pages — Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   the account ID, shown by `wrangler whoami`
#
# and a Pages project to deploy into, which you make once with:
#
#   wrangler pages project create <name> --production-branch main
#
# Then set PROJECT below to that name. Pages serves it at <name>.pages.dev, at the root
# of the domain — which this build needs, because it emits root-relative paths like
# /static/base.css and has no notion of a base path. A host that serves the site from a
# subdirectory will 404 on every stylesheet and every internal link.
#
# Deploying somewhere else instead? Delete this file. The build output is a plain folder
# of static files in public/, which any host will serve.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: theseus-build-system

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      # Only needed for font subsetting: libharfbuzz-bin provides hb-subset, woff2
      # provides woff2_compress. The starter ships no fonts, so this does nothing until
      # you add one — but having it here means the first font you drop into /fonts gets
      # subsetted in CI, rather than silently falling back to a system font.
      # Drop this step if you don't use webfonts, or if you commit the generated
      # content/static/fonts folder instead (see fonts/_README.md).
      - name: Install font subsetting tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libharfbuzz-bin woff2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      # Note: no --draft. `build` is the one command that excludes drafts by default,
      # which is what you want for the published site.
      - name: Build
        run: node --disable-warning=ExperimentalWarning system/app.ts build

      # The build reports broken links, missing frontmatter and failed macros by printing
      # to the terminal — it does not fail. Read the log above this step; a clean build
      # prints nothing between "Build" and here.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.PROJECT }} --branch=${{ github.ref_name }}
